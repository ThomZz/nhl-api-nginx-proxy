events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 100M;

    # Needed to resolve the redirect target hostname at request time,
    # since proxy_pass uses a variable in the redirect handler below.
    resolver 8.8.8.8 1.1.1.1 ipv6=off valid=300s;

    server {
        # Listen on port 3128 inside the container
        listen 8080;
        server_name localhost;

        location / {
            # Define your HTTPS destination
            proxy_pass https://api-web.nhle.com;
            
            # Preserve original request attributes
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            
            # 1. Force the HTTP Host header to match the destination domain
            proxy_set_header Host api-web.nhle.com;

            # Catch upstream 3xx redirects and follow them server-side
            # (inside the container) instead of returning them to the browser.
            # This avoids the browser making a second hop that Render's
            # firewall would block.
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @handle_redirect;

            # DISGUISE THE REQUEST: Add a standard browser User-Agent
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            
            # 2. Force the TLS Handshake SNI to match the destination domain
            proxy_ssl_server_name on;
            proxy_ssl_name api-web.nhle.com;
            
            # 3. Prevent 421 errors caused by connection reuse over mismatched contexts
            proxy_ssl_session_reuse off;
            
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

            # Handle preflight OPTIONS requests instantly without hitting the NHL API
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # Follows an upstream redirect from within the container and returns
        # the FINAL response to the browser (with CORS headers), so the client
        # never has to make the blocked second hop.
        location @handle_redirect {
            # The redirect target the upstream sent in its Location header.
            set $redirect_target $upstream_http_location;
            proxy_pass $redirect_target;

            proxy_pass_request_headers on;
            proxy_pass_request_body on;

            proxy_set_header Host api-web.nhle.com;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";

            proxy_ssl_server_name on;
            proxy_ssl_name api-web.nhle.com;
            proxy_ssl_session_reuse off;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            # Follow further redirects too, up to the chain limit below.
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @handle_redirect;

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        }
    }
}
