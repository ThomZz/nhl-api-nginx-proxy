events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 100M;

    # Needed to resolve upstream hostnames at request time, since the redirect
    # handler below uses a variable in proxy_pass.
    resolver 8.8.8.8 1.1.1.1 ipv6=off valid=300s;

    server {
        # Listen on port 8080 inside the container
        listen 8080;
        server_name localhost;

        # ------------------------------------------------------------------
        # Route by path prefix:
        #   /web/...   -> https://api-web.nhle.com/...
        #   /stats/... -> https://api.nhle.com/stats/...
        # ------------------------------------------------------------------

        location /web/ {
            proxy_pass https://api-web.nhle.com/;

            proxy_pass_request_headers on;
            proxy_pass_request_body on;

            # Force HTTP Host + TLS SNI to match this upstream
            proxy_set_header Host api-web.nhle.com;
            proxy_ssl_name api-web.nhle.com;

            proxy_ssl_server_name on;
            proxy_ssl_session_reuse off;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";

            # Follow upstream redirects server-side (see @handle_redirect)
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @handle_redirect;

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        location /stats/ {
            # No trailing slash: the /stats prefix is PRESERVED and forwarded,
            # so /stats/rest/... -> https://api.nhle.com/stats/rest/...
            proxy_pass https://api.nhle.com;

            proxy_pass_request_headers on;
            proxy_pass_request_body on;

            # Force HTTP Host + TLS SNI to match this upstream
            proxy_set_header Host api.nhle.com;
            proxy_ssl_name api.nhle.com;

            proxy_ssl_server_name on;
            proxy_ssl_session_reuse off;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";

            # Follow upstream redirects server-side (see @handle_redirect)
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @handle_redirect;

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # Follows an upstream redirect from within the container and returns
        # the FINAL response to the browser (with CORS headers), so the client
        # never has to make the second hop that Render's firewall would block.
        #
        # Host and TLS SNI are intentionally NOT overridden here: with a
        # variable proxy_pass, nginx derives both from the redirect target's
        # host, so this handler works for redirects to either NHL upstream.
        location @handle_redirect {
            set $redirect_target $upstream_http_location;
            proxy_pass $redirect_target;

            proxy_pass_request_headers on;
            proxy_pass_request_body on;

            proxy_ssl_server_name on;
            proxy_ssl_session_reuse off;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";

            # Follow further redirects in the chain too
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @handle_redirect;

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        }
    }
}
